<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Glow Workout 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pastel: #FFF5F9;
      --card-bg: #FFFFFF;
      --pink-primary: #FFB7D5;
      --pink-dark: #FF7B9C;
      --purple-primary: #D8B4F8;
      --purple-dark: #A27B5C;
      --purple-text: #6B4E71;
      --gray-light: #F2EAF7;
      --gray-text: #8E7C93;
      --shadow: 0 10px 25px rgba(216, 180, 248, 0.3);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Mali', cursive, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #FFF5F9 0%, #F3E8FF 100%);
      color: var(--purple-text);
      min-height: 100vh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 10px 0;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #7D4C86;
      text-shadow: 2px 2px 0px #FFD6E8;
    }

    header p {
      font-size: 14px;
      color: var(--gray-text);
      font-weight: 500;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 3px solid #FFF;
    }

    /* Player Styles */
    .player-card {
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      background: var(--purple-primary);
      color: white;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .status-badge.rest {
      background: var(--pink-primary);
    }

    .exercise-title {
      font-size: 20px;
      font-weight: 700;
      color: #5C3A63;
      min-height: 30px;
      margin-bottom: 4px;
    }

    .exercise-desc {
      font-size: 13px;
      color: var(--gray-text);
      min-height: 36px;
      margin-bottom: 12px;
    }

    .illustration-box {
      height: 170px;
      background: #FAF3FF;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 2px dashed #E2CEF5;
      position: relative;
    }

    .svg-character {
      width: 140px;
      height: 140px;
      transition: all 0.3s ease;
    }

    .timer-display {
      font-size: 48px;
      font-weight: 700;
      color: #6C3B75;
      line-height: 1;
      margin-bottom: 6px;
    }

    .step-indicator {
      font-size: 13px;
      font-weight: 700;
      color: var(--pink-dark);
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-weight: 700;
      border-radius: 16px;
      transition: transform 0.1s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.94);
    }

    .btn-main {
      background: linear-gradient(135deg, #FFB7D5 0%, #D8B4F8 100%);
      color: white;
      padding: 12px 28px;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(255, 183, 213, 0.5);
      min-width: 120px;
    }

    .btn-sub {
      background: var(--gray-light);
      color: var(--purple-text);
      padding: 12px;
      font-size: 16px;
      width: 46px;
      height: 46px;
    }

    /* Calendar Styles */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .calendar-title {
      font-size: 18px;
      font-weight: 700;
      color: #5C3A63;
    }

    .month-picker {
      font-size: 14px;
      font-weight: 700;
      color: var(--purple-text);
      background: var(--gray-light);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      color: var(--gray-text);
      margin-bottom: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      aspect-ratio: 1;
      border-radius: 14px;
      background: #FAF7FC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      position: relative;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .day-cell.today {
      border-color: var(--purple-primary);
    }

    .day-cell .status-icon {
      font-size: 14px;
      margin-top: 2px;
    }

    .day-cell[data-status="done"] {
      background: #FFE4EF;
      color: #D81B60;
    }

    .day-cell[data-status="rest"] {
      background: #E8DDFF;
      color: #5E35B1;
    }

    .day-cell[data-status="missed"] {
      background: #F0F0F0;
      color: #9E9E9E;
    }

    .legend {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed #EADBF0;
      font-size: 11px;
      font-weight: 700;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* List Card */
    .list-title {
      font-size: 18px;
      font-weight: 700;
      color: #5C3A63;
      margin-bottom: 12px;
    }

    .workout-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .workout-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #FAF7FC;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .workout-item.active {
      background: #F3E5F5;
      border-left: 4px solid var(--purple-primary);
    }

    .workout-item span.duration {
      font-size: 11px;
      color: var(--gray-text);
      background: #FFF;
      padding: 2px 8px;
      border-radius: 10px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .anim-work {
      animation: pulse 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🌸 Chinese Sister Glow 🌸</h1>
      <p>15 นาที สไตล์พี่สาวจีน • เอวคอด ขากระชับ ไร้เวียนหัว</p>
    </header>

    <!-- WORKOUT PLAYER -->
    <div class="card player-card">
      <div id="statusBadge" class="status-badge">พร้อมแล้วเริ่มกันเลย!</div>
      <div id="exerciseTitle" class="exercise-title">เตรียมตัวเข้าสู่โปรแกรม</div>
      <div id="exerciseDesc" class="exercise-desc">กดปุ่มเริ่มเล่นเพื่อเริ่มยืดเส้นและออกกำลังกาย</div>

      <div class="illustration-box">
        <svg class="svg-character" id="svgGraphic" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="#FFB7D5" opacity="0.4" />
          <circle cx="50" cy="30" r="14" fill="#6B4E71" />
          <path d="M 35 75 Q 50 45 65 75 Z" fill="#D8B4F8" />
          <circle cx="50" cy="32" r="11" fill="#FFE0BD" />
          <circle cx="46" cy="31" r="1.5" fill="#333" />
          <circle cx="54" cy="31" r="1.5" fill="#333" />
          <path d="M 47 36 Q 50 39 53 36" stroke="#FF7B9C" stroke-width="1.5" fill="none" />
        </svg>
      </div>

      <div id="timerDisplay" class="timer-display">00:45</div>
      <div id="stepIndicator" class="step-indicator">ท่าที่ 0 / 10</div>

      <div class="controls">
        <button class="btn btn-sub" onclick="prevExercise()" title="ย้อนท่า">⏮️</button>
        <button id="mainBtn" class="btn btn-main" onclick="toggleTimer()">เริ่มเลอ!</button>
        <button class="btn btn-sub" onclick="nextExercise()" title="ข้ามท่า">⏭️</button>
        <button class="btn btn-sub" onclick="resetWorkout()" title="เริ่มใหม่">🔄</button>
      </div>
    </div>

    <!-- CALENDAR CHECK-IN -->
    <div class="card">
      <div class="calendar-header">
        <div class="calendar-title">🗓️ ตารางเช็กอินมินิเกม</div>
        <div id="currentMonth" class="month-picker">พฤศจิกายน</div>
      </div>

      <div class="weekdays">
        <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>

      <div class="legend">
        <div class="legend-item"><span>✨</span> ออกแล้ว</div>
        <div class="legend-item"><span>🌸</span> วันพัก</div>
        <div class="legend-item"><span>💤</span> ขี้เกียจ/โดน</div>
      </div>
    </div>

    <!-- WORKOUT LIST -->
    <div class="card">
      <div class="list-title">📋 10 ท่าปังๆ 15 นาทีจบ!</div>
      <div id="workoutList" class="workout-list"></div>
    </div>
  </div>

  <script>
    // 10 Low-Impact Workouts tailored for waist & thight fat loss (No dizziness, knee safe)
    const exercises = [
      { name: "1. ยืดแขนบิดเอว (Standing Waist Twist)", time: 45, rest: 15, desc: "ยืนตรง บิดลำตัวซ้าย-ขวา ช้าๆ เกร็งหน้าท้อง เน้นกระชับเอวเอส", svg: 'waist' },
      { name: "2. วาดแขนยกเข่าเฉียง (Side Knee Drive)", time: 45, rest: 15, desc: "ดึงเข่าขึ้นหาข้อศอกด้านข้างทีละข้าง ลดไขมันห่วงยางข้างลำตัว", svg: 'knee' },
      { name: "3. ผลักมือข้างลำตัว (Side Arm Reach)", time: 45, rest: 15, desc: "เอียงตัวไปข้างๆ ยืดแขนไปสุด เกร็งท้องด้านข้าง ถนอมเข่า 100%", svg: 'reach' },
      { name: "4. ยืนเตะขาไปข้างหลัง (Glute Kickback)", time: 45, rest: 15, desc: "ยืนตรง หนีบก้น เตะขาไปข้างหลังสลับซ้าย-ขวา ช่วยยกกระชับสะโพก", svg: 'kick' },
      { name: "5. ชูมือแตะปลายเท้า (Standing Toe Touch)", time: 45, rest: 15, desc: "ยกขาขึ้นด้านหน้าแตะมือ ไม่ก้มหัวต่ำ ป้องกันอาการเวียนหัว", svg: 'toe' },
      { name: "6. หมุนสะโพกเอวคอด (Hip Circle)", time: 45, rest: 15, desc: "หมุนสะโพกเป็นวงกลม เกร็งหน้าท้อง สไตล์พี่สาวจีนคลายกล้ามเนื้อ", svg: 'circle' },
      { name: "7. เตะขาออกข้าง (Standing Side Leg Lift)", time: 45, rest: 15, desc: "ยกขาออกด้านข้างสลับซ้ายขวา ลดไขมันต้นขาด้านนอกเน้นๆ", svg: 'side' },
      { name: "8. ยืนต่อยลมบิดตัว (Standing Cross Punch)", time: 45, rest: 15, desc: "ต่อยลมไปทิศตรงข้าม พร้อมบิดลำตัว เผาผลาญไขมันทั้งตัว", svg: 'punch' },
      { name: "9. วาดแขนวงกลมกระชับต้นแขน (Arm Circles)", time: 45, rest: 15, desc: "กางแขนออกข้าง หมุนเป็นวงกลมเล็กๆ ลดไขมันส่วนหลังและแขน", svg: 'arms' },
      { name: "10. คูลดาวน์ยืดตัว (Pastel Stretch)", time: 45, rest: 15, desc: "หายใจเข้าลึกๆ ยืดตัวขึ้นสุด คลายกล้ามเนื้อเตรียมปิดเกม!", svg: 'stretch' }
    ];

    let currentIdx = 0;
    let isWorking = true;
    let isRunning = false;
    let timer = null;
    let timeLeft = exercises[0].time;
    let checkInState = JSON.parse(localStorage.getItem('workout_checkin_data')) || {};

    // Audio effects using Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 600, duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function updateUI() {
      const ex = exercises[currentIdx];
      const statusBadge = document.getElementById("statusBadge");
      const graphic = document.getElementById("svgGraphic");

      if (isWorking) {
        statusBadge.textContent = "🔥 ลุยเลย! (Work)";
        statusBadge.className = "status-badge";
        document.getElementById("exerciseTitle").textContent = ex.name;
        document.getElementById("exerciseDesc").textContent = ex.desc;
        graphic.parentElement.classList.add("anim-work");
      } else {
        statusBadge.textContent = "🌸 พักแป๊บนะ (Rest)";
        statusBadge.className = "status-badge rest";
        document.getElementById("exerciseTitle").textContent = "พักผ่อน หายใจเข้าลึกๆ";
        document.getElementById("exerciseDesc").textContent = "เตรียมตัวพบกับท่าถัดไป: " + (exercises[currentIdx + 1]?.name || "เสร็จสิ้น!");
        graphic.parentElement.classList.remove("anim-work");
      }

      document.getElementById("stepIndicator").textContent = `ท่าที่ ${currentIdx + 1} / ${exercises.length}`;
      document.getElementById("timerDisplay").textContent = formatTime(timeLeft);
      renderWorkoutList();
      updateSVG(ex.svg);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function toggleTimer() {
      const btn = document.getElementById("mainBtn");
      if (isRunning) {
        clearInterval(timer);
        isRunning = false;
        btn.textContent = "ลุยต่อ!";
      } else {
        isRunning = true;
        btn.textContent = "หยุดพัก";
        timer = setInterval(tick, 1000);
      }
    }

    function tick() {
      if (timeLeft > 1) {
        timeLeft--;
        if (timeLeft <= 3) playBeep(700, 0.1);
      } else {
        playBeep(1000, 0.3);
        if (isWorking) {
          isWorking = false;
          timeLeft = exercises[currentIdx].rest;
        } else {
          isWorking = true;
          if (currentIdx < exercises.length - 1) {
            currentIdx++;
            timeLeft = exercises[currentIdx].time;
          } else {
            completeWorkout();
            return;
          }
        }
      }
      updateUI();
    }

    function nextExercise() {
      if (currentIdx < exercises.length - 1) {
        currentIdx++;
        isWorking = true;
        timeLeft = exercises[currentIdx].time;
        updateUI();
      }
    }

    function prevExercise() {
      if (currentIdx > 0) {
        currentIdx--;
        isWorking = true;
        timeLeft = exercises[currentIdx].time;
        updateUI();
      }
    }

    function resetWorkout() {
      clearInterval(timer);
      isRunning = false;
      currentIdx = 0;
      isWorking = true;
      timeLeft = exercises[0].time;
      document.getElementById("mainBtn").textContent = "เริ่มเลอ!";
      updateUI();
    }

    function completeWorkout() {
      clearInterval(timer);
      isRunning = false;
      document.getElementById("statusBadge").textContent = "🎉 สำเร็จแล้ว เก่งมาก!";
      document.getElementById("exerciseTitle").textContent = "เสร็จสิ้นภารกิจ 15 นาที!";
      document.getElementById("exerciseDesc").textContent = "ระบบทำการเช็กอินให้คุณอัตโนมัติเรียบร้อยแล้ว ❤️";
      document.getElementById("mainBtn").textContent = "เล่นอีกครั้ง";

      // Auto check-in today
      const todayKey = getTodayKey();
      checkInState[todayKey] = 'done';
      localStorage.setItem('workout_checkin_data', JSON.stringify(checkInState));
      renderCalendar();
    }

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    // Dynamic SVG Graphic Swap
    function updateSVG(type) {
      const svg = document.getElementById("svgGraphic");
      let pathContent = `<circle cx="50" cy="50" r="38" fill="#FFB7D5" opacity="0.3"/>`;
      pathContent += `<circle cx="50" cy="28" r="12" fill="#6B4E71"/>
                      <circle cx="50" cy="30" r="10" fill="#FFE0BD"/>
                      <circle cx="46" cy="29" r="1.5" fill="#333"/>
                      <circle cx="54" cy="29" r="1.5" fill="#333"/>
                      <path d="M 47 34 Q 50 37 53 34" stroke="#FF7B9C" stroke-width="1.5" fill="none"/>`;

      if (type === 'waist' || type === 'circle') {
        pathContent += `<path d="M 40 45 Q 50 40 60 45 L 56 75 L 44 75 Z" fill="#D8B4F8"/>
                        <path d="M 30 50 Q 50 65 70 50" stroke="#FF7B9C" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      } else if (type === 'knee' || type === 'side') {
        pathContent += `<path d="M 42 45 L 58 45 L 54 68 L 46 68 Z" fill="#D8B4F8"/>
                        <line x1="56" y1="68" x2="72" y2="52" stroke="#6B4E71" stroke-width="6" stroke-linecap="round"/>
                        <line x1="44" y1="68" x2="44" y2="88" stroke="#6B4E71" stroke-width="6" stroke-linecap="round"/>`;
      } else {
        pathContent += `<path d="M 42 45 L 58 45 L 55 75 L 45 75 Z" fill="#D8B4F8"/>
                        <line x1="30" y1="48" x2="70" y2="48" stroke="#FF7B9C" stroke-width="5" stroke-linecap="round"/>
                        <line x1="46" y1="75" x2="44" y2="92" stroke="#6B4E71" stroke-width="5"/>
                        <line x1="54" y1="75" x2="56" y2="92" stroke="#6B4E71" stroke-width="5"/>`;
      }
      svg.innerHTML = pathContent;
    }

    // Render Workout List
    function renderWorkoutList() {
      const container = document.getElementById("workoutList");
      container.innerHTML = exercises.map((ex, i) => `
        <div class="workout-item ${i === currentIdx ? 'active' : ''}">
          <span>${ex.name}</span>
          <span class="duration">45s / 15s</span>
        </div>
      `).join('');
    }

    // Render Mini-game Calendar
    function renderCalendar() {
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      document.getElementById("currentMonth").textContent = `${now.toLocaleString('th-TH', { month: 'long' })} ${year + 543}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayDate = now.getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement("div"));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        const key = `${year}-${month + 1}-${day}`;
        const status = checkInState[key] || '';

        cell.className = `day-cell ${day === todayDate ? 'today' : ''}`;
        cell.dataset.status = status;
        
        let icon = '';
        if (status === 'done') icon = '✨';
        else if (status === 'rest') icon = '🌸';
        else if (status === 'missed') icon = '💤';

        cell.innerHTML = `<div>${day}</div><div class="status-icon">${icon}</div>`;

        // Click to toggle status manually
        cell.onclick = () => {
          const modes = ['', 'done', 'rest', 'missed'];
          const next = modes[(modes.indexOf(status) + 1) % modes.length];
          if (next) checkInState[key] = next;
          else delete checkInState[key];
          localStorage.setItem('workout_checkin_data', JSON.stringify(checkInState));
          renderCalendar();
        };

        grid.appendChild(cell);
      }
    }

    // Init
    updateUI();
    renderCalendar();
  </script>
</body>
</html>
