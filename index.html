<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-MIN EASY WORKOUT v2</title>
    <style>
        :root {
            --bg-black: #0a0a0a;
            --card-gray: #161616;
            --accent-red: #ff0000;
            --text-white: #ffffff;
            --text-muted: #888888;
            --green-rest: #00ff66;
            --yellow-prep: #ffcc00;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-gray);
            border: 3px solid var(--accent-red);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-red);
            font-size: 24px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            font-weight: 900;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 15px;
        }

        .status-box {
            background: #000;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .phase-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-white);
            height: 22px;
        }

        .move-name {
            font-size: 20px;
            color: var(--accent-red);
            font-weight: bold;
            margin: 10px 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-display {
            font-size: 56px;
            font-weight: bold;
            font-family: monospace;
            color: var(--text-white);
            margin: 5px 0;
        }

        .progress-text {
            color: var(--text-muted);
            font-size: 13px;
        }

        .btn-group-main {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--accent-red);
            color: var(--text-white);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: 0.1s;
        }

        .btn:active { transform: scale(0.96); }

        .btn-nav {
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        /* Move Selector List */
        .moves-list-box {
            background: #111;
            border-radius: 8px;
            padding: 10px;
            max-height: 140px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid #222;
        }

        .move-item {
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 4px;
            color: #888;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .move-item.active {
            background: #2a0000;
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 8-MIN EASY WORKOUT</h1>
    <div class="subtitle">ปรับเวลาตั้งตัว + กดข้ามท่าได้ตามใจ</div>

    <div class="status-box">
        <div class="phase-title" id="phase">พร้อมเริ่มไหมมึง?</div>
        <div class="move-name" id="move">กด START ด้านล่างเลย</div>
        <div class="timer-display" id="timer">00:30</div>
        <div class="progress-text" id="progress">ท่าที่ 1 / 8</div>
    </div>

    <!-- Main Control Buttons -->
    <div class="btn-group-main">
        <button class="btn" id="start-btn" onclick="toggleWorkout()">START WORKOUT</button>
    </div>

    <!-- Skip / Navigation Buttons -->
    <div class="nav-group">
        <button class="btn-nav" id="prev-btn" onclick="prevStep()">⏮️ ย้อนกลับ</button>
        <button class="btn-nav" onclick="resetCurrentTimer()">🔄 เริ่มเวลานับใหม่</button>
        <button class="btn-nav" id="next-btn" onclick="nextStep()">ข้ามท่า ⏭️</button>
    </div>

    <!-- Move List Selector -->
    <div class="moves-list-box" id="moves-container"></div>
</div>

<script>
    const workoutList = [
        "1. เดินย่ำอยู่กับที่ + แกว่งแขน",
        "2. Wall Sit (พิงกำแพงย่อตัว)",
        "3. ยืนยกเข่าแตะศอกสลับข้าง",
        "4. Glute Bridge (นอนยกสะโพก)",
        "5. คุกเข่าวิดพื้น (กับเตียง/โซฟา)",
        "6. Bird-Dog (คุกเข่ายืดแขนขา)",
        "7. ชูขวดน้ำขึ้นเหนือศีรษะ",
        "8. Plank เกร็งหน้าท้อง"
    ];

    const WORK_TIME = 30;
    const REST_TIME = 15;
    const PREP_TIME = 10; // เวลาเตรียมตัวก่อนเริ่มท่าใหม่

    let currentStep = 0;
    let timeLeft = WORK_TIME;
    let currentPhase = 'IDLE'; // IDLE, PREP, WORK, REST
    let timerInterval = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    }

    function initList() {
        const container = document.getElementById('moves-container');
        container.innerHTML = '';
        workoutList.forEach((move, idx) => {
            const div = document.createElement('div');
            div.className = `move-item ${idx === currentStep ? 'active' : ''}`;
            div.innerText = move;
            div.onclick = () => selectStep(idx);
            container.appendChild(div);
        });
    }

    function toggleWorkout() {
        if (currentPhase === 'IDLE' || currentPhase === 'PAUSED') {
            startWorkout();
        } else {
            pauseWorkout();
        }
    }

    function startWorkout() {
        if (currentPhase === 'IDLE') {
            currentPhase = 'PREP';
            timeLeft = PREP_TIME;
        } else if (currentPhase === 'PAUSED') {
            currentPhase = window.lastPhase || 'WORK';
        }

        document.getElementById('start-btn').innerText = "PAUSE";
        document.getElementById('start-btn').style.backgroundColor = "#fff";
        document.getElementById('start-btn').style.color = "#000";

        updateUI();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;

            if (timeLeft <= 3 && timeLeft > 0) {
                playBeep(440, 'sine', 0.1);
            }

            if (timeLeft < 0) {
                playBeep(880, 'square', 0.3);
                
                if (currentPhase === 'PREP') {
                    currentPhase = 'WORK';
                    timeLeft = WORK_TIME;
                } else if (currentPhase === 'WORK') {
                    currentPhase = 'REST';
                    timeLeft = REST_TIME;
                } else if (currentPhase === 'REST') {
                    if (currentStep < workoutList.length - 1) {
                        currentStep++;
                        currentPhase = 'PREP';
                        timeLeft = PREP_TIME;
                    } else {
                        completeWorkout();
                        return;
                    }
                }
            }
            updateUI();
        }, 1000);
    }

    function pauseWorkout() {
        window.lastPhase = currentPhase;
        currentPhase = 'PAUSED';
        clearInterval(timerInterval);
        document.getElementById('start-btn').innerText = "RESUME";
        document.getElementById('start-btn').style.backgroundColor = "var(--accent-red)";
        document.getElementById('start-btn').style.color = "#fff";
        updateUI();
    }

    function nextStep() {
        if (currentStep < workoutList.length - 1) {
            currentStep++;
            resetToPrep();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            resetToPrep();
        }
    }

    function selectStep(idx) {
        currentStep = idx;
        resetToPrep();
    }

    function resetCurrentTimer() {
        resetToPrep();
    }

    function resetToPrep() {
        clearInterval(timerInterval);
        currentPhase = 'PREP';
        timeLeft = PREP_TIME;
        if (document.getElementById('start-btn').innerText === "PAUSE") {
            startWorkout();
        } else {
            updateUI();
        }
    }

    function completeWorkout() {
        clearInterval(timerInterval);
        currentPhase = 'IDLE';
        document.getElementById('phase').innerText = "🎉 FINISH!";
        document.getElementById('phase').style.color = "var(--accent-red)";
        document.getElementById('move').innerText = "สุดยอดมึง! ออกกำลังกายครบแล้ว";
        document.getElementById('timer').innerText = "00:00";
        document.getElementById('start-btn').innerText = "PLAY AGAIN";
        document.getElementById('start-btn').style.backgroundColor = "var(--accent-red)";
        document.getElementById('start-btn').style.color = "#fff";
        currentStep = 0;
        initList();
    }

    function updateUI() {
        const phaseElem = document.getElementById('phase');
        const moveElem = document.getElementById('move');

        if (currentPhase === 'PREP') {
            phaseElem.innerText = "⏳ เตรียมตัวเข้าตำแหน่ง!";
            phaseElem.style.color = "var(--yellow-prep)";
            moveElem.innerText = workoutList[currentStep];
        } else if (currentPhase === 'WORK') {
            phaseElem.innerText = "🔥 ลุยเลยมึง! (WORK)";
            phaseElem.style.color = "var(--accent-red)";
            moveElem.innerText = workoutList[currentStep];
        } else if (currentPhase === 'REST') {
            phaseElem.innerText = "☕ พักแป๊บ (REST)";
            phaseElem.style.color = "var(--green-rest)";
            moveElem.innerText = "ท่าต่อไป: " + workoutList[currentStep + 1];
        } else if (currentPhase === 'PAUSED') {
            phaseElem.innerText = "⏸️ หยุดชั่วคราว";
            phaseElem.style.color = "#fff";
        }

        const sec = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        document.getElementById('timer').innerText = `00:${sec}`;
        document.getElementById('progress').innerText = `ท่าที่ ${currentStep + 1} / ${workoutList.length}`;

        document.getElementById('prev-btn').disabled = (currentStep === 0);
        document.getElementById('next-btn').disabled = (currentStep === workoutList.length - 1);

        initList();
    }

    initList();
</script>

</body>
</html>
