<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY WORKOUT - RED & BLACK EDITION</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-red: #ff1e27;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 2px solid var(--accent-red);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 0 20px rgba(255, 30, 39, 0.2);
        }

        h1 {
            text-align: center;
            color: var(--accent-red);
            font-size: 24px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-gray);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--accent-red);
            color: var(--text-white);
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #d1121b;
            box-shadow: 0 0 10px rgba(255, 30, 39, 0.5);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--text-white);
            color: var(--text-white);
        }

        .btn-outline:hover {
            background-color: var(--text-white);
            color: var(--bg-color);
        }

        .routine-card {
            background: #262626;
            border-left: 4px solid var(--accent-red);
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .exercise-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .exercise-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .exercise-item input[type="checkbox"] {
            accent-color: var(--accent-red);
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        /* Timer Section */
        .timer-box {
            text-align: center;
            background: #000;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            color: var(--accent-red);
            font-family: monospace;
            margin: 10px 0;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
        }

        .timer-controls button {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 EASY FIT (RED EDITION)</h1>
    <p class="subtitle">ง่ายๆ สั้นๆ ไม่ปวดเข่า ทำเองที่บ้าน</p>

    <!-- Interactive Button -->
    <button class="btn" onclick="generateRandomWorkout()">🎲 สุ่มตารางออกกำลังกายวันนี้</button>

    <!-- Display Area -->
    <div class="routine-card">
        <h3 id="workout-title" style="margin-top: 0; color: var(--accent-red);">👇 กดปุ่มด้านบนเพื่อเริ่ม</h3>
        <ul class="exercise-list" id="workout-list">
            <li class="exercise-item" style="color: var(--text-gray);">ยังไม่ได้เลือกท่า...</li>
        </ul>
    </div>

    <!-- Timer Feature -->
    <div class="timer-box">
        <div style="font-size: 14px; color: var(--text-gray);">⏱️ นาฬิกาจับเวลา (45 วินาที)</div>
        <div class="timer-display" id="timer">00:45</div>
        <div class="timer-controls">
            <button class="btn" onclick="startTimer()">เริ่ม</button>
            <button class="btn btn-outline" onclick="resetTimer()">รีเซ็ต</button>
        </div>
    </div>
</div>

<script>
    // Easy & Knee-Friendly Exercises Pool
    const workoutDatabase = [
        {
            title: "SET A: สลายไขมันแบบชิลๆ",
            moves: ["ยืนย่ำอยู่กับที่ + แกว่งแขน (45 วินาที)", "Squat ย่อตัวครึ่งทาง (10 ครั้ง)", "คุกเข่าวิดพื้นกับโซฟา/เตียง (8 ครั้ง)", "เกร็งหน้าท้อง Plank (30 วินาที)"]
        },
        {
            title: "SET B: เน้นกระชับต้นขา & ก้น",
            moves: ["Glute Bridge นอนหงายยกสะโพก (12 ครั้ง)", "Standing Knee to Elbow ยืนยกเข่าแตะศอก (12 ครั้ง/ข้าง)", "Wall Sit พิงกำแพงย่อตัว (30 วินาที)", "เดินเร็วรอบห้อง (1 นาที)"]
        },
        {
            title: "SET C: ลดพุง & กระชับหลัง",
            moves: ["Bird-Dog ยืดแขนขาขนานพื้น (10 ครั้ง/ข้าง)", "ชูขวดน้ำขึ้นเหนือศีรษะ (15 ครั้ง)", "นอนคว่ำยกอก Superman (10 ครั้ง)", "ยืดเหยียดขาและหลัง (1 นาที)"]
        }
    ];

    let timerInterval = null;
    let timeLeft = 45;

    function generateRandomWorkout() {
        const randomIndex = Math.floor(Math.random() * workoutDatabase.length);
        const selected = workoutDatabase[randomIndex];

        document.getElementById('workout-title').innerText = selected.title;
        
        const listElement = document.getElementById('workout-list');
        listElement.innerHTML = '';

        selected.moves.forEach(move => {
            const li = document.createElement('li');
            li.className = 'exercise-item';
            li.innerHTML = `<input type="checkbox"> <span>${move}</span>`;
            listElement.appendChild(li);
        });
        
        resetTimer();
    }

    function startTimer() {
        if (timerInterval) return; // Prevent multiple intervals
        
        timerInterval = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
                alert("🎉 หมดเวลา! พักได้ 15 วินาที");
            }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        timeLeft = 45;
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        const seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        document.getElementById('timer').innerText = `00:${seconds}`;
    }
</script>

</body>
</html>
